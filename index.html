<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<!-- Full-screen when launched from the iPad Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="IM_ configurator" />
<meta name="theme-color" content="#1F1F23" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
<title>Build Your Implement Project</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --im-blue-green: #67817F;
    --im-green-grey: #B9C7C2;
    --im-black: #1F1F23;
    --im-ash: #30373B;
    --im-grey: #A8A5A1;
    --im-egg: #F8F5E7;
    --im-light-grey: #F2F2F1;
    --im-white: #FFFFFF;

    --im-blue-green-60: #A4B3B2;
    --im-blue-green-30: #C2CDCC;
    --im-blue-green-light: #E1E6E5;
    --im-blue-green-near-white: #F1F4F3;
    --im-green-grey-30: #E3E9E7;

    --font-display: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    --font-body: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, .app {
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* Full-screen behaviour on iPad when launched from the Home Screen */
  html { height: 100%; }
  body { overscroll-behavior: none; position: fixed; inset: 0; }
  .app {
    background: var(--im-white);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-body);
    background: var(--im-white);
    color: var(--im-black);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font-family: var(--font-body); cursor: pointer; }

  .app { position: fixed; inset: 0; width: auto; height: auto; display: flex; flex-direction: column; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 2rem;
    background: var(--im-white);
    border-bottom: 1px solid var(--im-blue-green-light);
    flex-shrink: 0;
  }
  header.top .logo { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.03em; color: var(--im-black); user-select: none; }
  header.top .logo span { color: var(--im-blue-green); }
  header.top .headline { font-family: var(--font-display); font-size: 1.12rem; color: var(--im-ash); }
  header.top .headline em { font-style: italic; color: var(--im-blue-green); }

  .stepper { display: flex; background: var(--im-white); border-bottom: 1px solid var(--im-blue-green-light); flex-shrink: 0; overflow-x: auto; }
  .stepper .step {
    flex: 1; text-align: center; padding: 0.6rem 0.4rem;
    font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--im-grey); border-bottom: 3px solid transparent;
    white-space: nowrap; transition: all 0.2s ease; user-select: none;
  }
  .stepper .step.active { color: var(--im-blue-green); border-bottom-color: var(--im-blue-green); font-weight: 700; }
  .stepper .step.done { color: var(--im-ash); }
  .stepper .step .tick { color: var(--im-blue-green); margin-right: 0.3rem; font-weight: 700; }

  main.layout { flex: 1; display: flex; min-height: 0; }
  @media (max-width: 880px) { main.layout { flex-direction: column; } }

  .visual-panel {
    flex: 1.22; background: var(--im-white); position: relative;
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--im-blue-green-light);
  }
  @media (max-width: 880px) {
    .visual-panel { flex: 1.1; border-right: none; border-bottom: 1px solid var(--im-blue-green-light); min-height: 46vh; }
  }
  .visual-stage { flex: 1; position: relative; overflow: hidden; }
  .stage-svg { width: 100%; height: 100%; display: block; }
  .fadein { animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .stage-plate {
    position: absolute; top: 0.85rem; left: 1.4rem;
    font-size: 0.7rem; color: var(--im-grey); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .stage-plate b { color: var(--im-ash); }

  .spec-strip { flex-shrink: 0; display: flex; flex-wrap: wrap; border-top: 1px solid var(--im-blue-green-light); background: var(--im-white); }
  .spec-cell { flex: 1 1 0; min-width: 108px; padding: 0.55rem 0.9rem 0.6rem; border-left: 1px solid var(--im-blue-green-near-white); }
  .spec-cell:first-child { border-left: none; }
  .spec-cell .k { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--im-grey); margin-bottom: 0.22rem; }
  .spec-cell .v { font-size: 0.74rem; font-weight: 700; color: var(--im-black); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spec-cell .v.dim { color: var(--im-grey); font-weight: 400; }

  .config-panel { flex: 1; background: var(--im-egg); display: flex; flex-direction: column; min-height: 0; }
  .config-body { flex: 1; overflow-y: auto; padding: 1.3rem 1.5rem 1rem; }
  .config-panel h2 { font-family: var(--font-display); font-weight: normal; font-size: 1.5rem; margin: 0 0 0.25rem; color: var(--im-black); }
  .config-panel h2 em { color: var(--im-blue-green); font-style: italic; }
  .config-panel .sub { font-size: 0.84rem; color: var(--im-ash); margin: 0 0 0.7rem; line-height: 1.4; }

  .explain {
    background: var(--im-blue-green-near-white);
    border-left: 3px solid var(--im-blue-green);
    padding: 0.55rem 0.8rem;
    font-size: 0.72rem; line-height: 1.45; color: var(--im-ash);
    margin: 0 0 1rem; border-radius: 2px;
  }
  .explain b { color: var(--im-black); }

  /* ---------- Contacts ---------- */
  .contacts {
    margin-top: 1rem; padding-top: 0.9rem;
    border-top: 1px solid var(--im-blue-green-near-white);
  }
  .contacts .c-title { font-size: 0.68rem; color: var(--im-grey); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.45rem; }
  .c-person { margin-top: 0.4rem; }
  .c-name { font-size: 0.78rem; font-weight: 700; color: var(--im-black); line-height: 1.25; }
  .c-mail { font-size: 0.72rem; color: var(--im-blue-green); line-height: 1.3; }

  /* ---------- Staff panel ---------- */
  .staff {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(31,31,35,0.55);
    display: none; align-items: center; justify-content: center;
  }
  .staff.open { display: flex; }
  .staff .panel {
    background: var(--im-white); border-radius: 2px;
    padding: 1.4rem; width: min(320px, 86vw);
  }
  .staff .panel h3 { font-family: var(--font-display); font-weight: normal; margin: 0 0 0.3rem; font-size: 1.2rem; }
  .staff .panel p { font-size: 0.75rem; color: var(--im-ash); margin: 0 0 1rem; }
  .staff .panel .btn { width: 100%; margin-bottom: 0.5rem; }

  .proj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
  @media (max-width: 500px) { .proj-grid { grid-template-columns: 1fr; } }
  .proj {
    background: var(--im-white); border: 1px solid var(--im-blue-green-light); border-radius: 2px;
    padding: 0.7rem 0.85rem; text-align: left; transition: all 0.18s ease; user-select: none;
  }
  .proj .name { font-weight: 700; font-size: 0.85rem; color: var(--im-black); display: block; }
  .proj .desc { font-size: 0.7rem; line-height: 1.3; color: var(--im-ash); display: block; margin-top: 0.15rem; }
  .proj .body-tag { font-size: 0.62rem; color: var(--im-grey); text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-top: 0.35rem; }
  .proj.selected { background: var(--im-blue-green); border-color: var(--im-blue-green); }
  .proj.selected .name, .proj.selected .desc { color: var(--im-white); }
  .proj.selected .body-tag { color: var(--im-green-grey-30); }
  .proj:active { transform: scale(0.97); }

  .band-block { margin-bottom: 1.1rem; }
  .band-head {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding-bottom: 0.3rem; margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--im-blue-green-light);
  }
  .band-head .b-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--im-blue-green);
  }
  .band-head .b-note { font-size: 0.66rem; color: var(--im-grey); line-height: 1.35; }
  .tile .sug {
    font-size: 0.55rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--im-blue-green); border: 1px dashed var(--im-blue-green-30);
    padding: 0.06rem 0.3rem; border-radius: 2px;
  }
  .group-block { margin-bottom: 1.1rem; }
  .group-head {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding-bottom: 0.3rem; margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--im-blue-green-light);
  }
  .group-head .g-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--im-blue-green);
  }
  .group-head .g-note { font-size: 0.66rem; color: var(--im-grey); line-height: 1.35; }

  .tile-grid { display: grid; grid-template-columns: 1fr; gap: 0.45rem; }
  .tile {
    position: relative;
    background: var(--im-white); border: 1px solid var(--im-blue-green-light); border-radius: 2px;
    padding: 0.6rem 2.3rem 0.6rem 0.75rem;
    text-align: left; transition: background 0.18s ease, border-color 0.18s ease; user-select: none;
    width: 100%;
  }
  .tile .row1 { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.15rem; flex-wrap: wrap; }
  .tile .dot { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(31,31,35,0.25); }
  .tile .pname { font-weight: 700; font-size: 0.8rem; color: var(--im-black); line-height: 1.25; }
  .tile .acr {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.08em;
    color: var(--im-blue-green); background: var(--im-blue-green-near-white);
    border: 1px solid var(--im-blue-green-light);
    padding: 0.08rem 0.32rem; border-radius: 2px; white-space: nowrap;
  }
  .tile .ord {
    font-size: 0.58rem; font-weight: 700;
    background: var(--im-blue-green); color: var(--im-white);
    padding: 0.08rem 0.34rem; border-radius: 2px;
  }
  .tile .desc { font-size: 0.7rem; line-height: 1.4; color: var(--im-ash); display: block; }
  .tile .info-btn {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--im-blue-green-30);
    background: var(--im-white); color: var(--im-blue-green);
    font-size: 0.7rem; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .tile .info-panel {
    font-size: 0.68rem; line-height: 1.5; color: var(--im-ash);
    margin-top: 0.5rem; padding-top: 0.5rem;
    border-top: 1px solid var(--im-blue-green-near-white);
  }
  .tile.selected { background: var(--im-blue-green); border-color: var(--im-blue-green); }
  .tile.selected .pname, .tile.selected .desc { color: var(--im-white); }
  .tile.selected .acr { color: var(--im-white); background: transparent; border-color: rgba(255,255,255,0.5); }
  .tile.selected .ord { background: var(--im-white); color: var(--im-blue-green); }
  .tile.selected .info-btn { background: transparent; color: var(--im-white); border-color: rgba(255,255,255,0.6); }
  .tile.selected .info-panel { color: var(--im-white); border-top-color: rgba(255,255,255,0.3); }
  .tile.disabled { opacity: 0.45; }

  .paint-legend {
    display: flex; gap: 0.5rem 0.85rem; flex-wrap: wrap;
    font-size: 0.62rem; color: var(--im-grey);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin: 0 0 0.9rem;
  }
  .paint-legend span b { color: var(--im-ash); }

  .engine-summary {
    background: var(--im-white); border: 1px solid var(--im-blue-green-light); border-radius: 2px;
    padding: 0.8rem 1.05rem;
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 0.85rem; position: sticky; top: 0; z-index: 2;
  }
  .engine-summary .out { font-family: var(--font-display); font-size: 1.85rem; color: var(--im-blue-green); line-height: 1; }
  .engine-summary .out small { font-family: var(--font-body); font-size: 0.68rem; color: var(--im-ash); text-transform: uppercase; letter-spacing: 0.08em; margin-left: 0.3rem; }
  .engine-summary .cfg { font-size: 0.76rem; color: var(--im-ash); text-align: right; line-height: 1.35; }
  .engine-summary .cfg b { color: var(--im-black); }

  .role-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .role-row {
    background: var(--im-white); border: 1px solid var(--im-blue-green-light); border-radius: 2px;
    padding: 0.6rem 0.85rem; display: flex; align-items: center; gap: 0.7rem; transition: all 0.18s ease;
  }
  .role-row.active { border-color: var(--im-blue-green); }
  .role-row .info { flex: 1; min-width: 0; }
  .role-row .info .name { font-weight: 700; font-size: 0.86rem; color: var(--im-black); }
  .role-row .info .meta { font-size: 0.68rem; color: var(--im-ash); margin-top: 0.1rem; line-height: 1.3; }
  .role-row .hp-each { font-family: var(--font-display); font-size: 0.95rem; color: var(--im-grey); flex-shrink: 0; width: 3.4rem; text-align: right; }
  .role-row.active .hp-each { color: var(--im-blue-green); }
  .step-ctrl { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .step-ctrl button {
    width: 34px; height: 34px; border-radius: 2px;
    border: 1px solid var(--im-blue-green); background: transparent; color: var(--im-blue-green);
    font-size: 1.1rem; font-weight: 700; line-height: 1; transition: all 0.15s ease;
  }
  .step-ctrl button:disabled { opacity: 0.25; }
  .step-ctrl button:active:not(:disabled) { background: var(--im-blue-green); color: white; transform: scale(0.95); }
  .step-ctrl .cnt { width: 1.4rem; text-align: center; font-weight: 700; font-size: 0.95rem; color: var(--im-black); }

  .pkg-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .pkg-card {
    position: relative;
    background: var(--im-white); border: 1px solid var(--im-blue-green-light); border-radius: 2px;
    padding: 0.8rem 1rem; display: flex; align-items: flex-start; gap: 0.75rem; transition: all 0.18s ease;
    text-align: left;
  }
  .pkg-card .txt { flex: 1; min-width: 0; }
  .pkg-card .txt .name { padding-right: 7rem; }
  .mfk {
    position: absolute; top: 8px; right: 8px;
    background: var(--im-blue-green);
    border: 1px solid #56706E;
    color: #FFFFFF;
    font-size: 0.55rem; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 0.2rem 0.5rem; border-radius: 2px;
  }
  .pkg-card .chk {
    width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px;
    border: 1.5px solid var(--im-grey); border-radius: 2px;
    display: flex; align-items: center; justify-content: center; transition: all 0.18s ease;
  }
  .pkg-card.selected { border-color: var(--im-blue-green); }
  .pkg-card.selected .chk { background: var(--im-blue-green); border-color: var(--im-blue-green); }
  .pkg-card.selected .chk::after {
    content: ''; width: 8px; height: 5px;
    border-left: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(1px,-1px);
  }
  .pkg-card .txt .name { font-weight: 700; font-size: 0.88rem; color: var(--im-black); }
  .pkg-card .txt .desc { font-size: 0.73rem; color: var(--im-ash); margin-top: 0.15rem; line-height: 1.35; }
  .pkg-card .txt .fit { font-size: 0.63rem; color: var(--im-grey); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ---------- Window sticker ---------- */
  .sticker {
    background: var(--im-white);
    border: 2px solid var(--im-black);
    border-radius: 2px;
    overflow: hidden;
  }
  .st-head { background: var(--im-black); color: var(--im-white); padding: 0.85rem 1rem 0.95rem; }
  .st-brand { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--im-green-grey); margin-bottom: 0.4rem; }
  .st-brand span { color: var(--im-white); }
  .st-model { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.15; }
  .st-model em { font-style: italic; color: var(--im-green-grey); }
  .st-sub { font-size: 0.7rem; color: var(--im-grey); margin-top: 0.25rem; }

  .st-sec { padding: 0.7rem 1rem; border-bottom: 1px solid var(--im-blue-green-light); }
  .st-sec-t {
    font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--im-blue-green); font-weight: 700; margin-bottom: 0.45rem;
  }
  .st-line {
    display: flex; align-items: baseline; gap: 0.4rem;
    font-size: 0.76rem; padding: 0.16rem 0; color: var(--im-black);
  }
  .st-line .k { color: var(--im-ash); white-space: nowrap; display: flex; align-items: center; gap: 0.35rem; }
  .st-line .d { flex: 1; border-bottom: 1px dotted var(--im-blue-green-30); transform: translateY(-3px); min-width: 1rem; }
  .st-line .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .st-line .sw { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(31,31,35,0.3); display: inline-block; }
  .st-mfk {
    font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase;
    background: var(--im-blue-green); color: #fff; padding: 0.05rem 0.3rem; border-radius: 2px; margin-left: 0.3rem;
  }
  .st-note { background: var(--im-blue-green-near-white); }
  .st-narrative { font-size: 0.75rem; line-height: 1.55; color: var(--im-ash); }

  .st-foot {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    padding: 0.85rem 1rem; border-top: 2px solid var(--im-black);
  }
  .st-foot-t { font-family: var(--font-display); font-size: 0.98rem; color: var(--im-black); margin-bottom: 0.15rem; }
  .st-foot-p { font-size: 0.68rem; color: var(--im-ash); line-height: 1.4; margin-bottom: 0.5rem; }
  .st-foot-r { text-align: center; flex-shrink: 0; }
  .st-print { width: 100%; margin-top: 0.8rem; }
  #qrcode { padding: 5px; background: white; border: 1px solid var(--im-blue-green-near-white); }
  .qr-hint { font-size: 0.58rem; color: var(--im-grey); max-width: 7rem; line-height: 1.3; margin-top: 0.3rem; }

  .config-footer {
    flex-shrink: 0; display: flex; justify-content: space-between; gap: 0.75rem;
    padding: 0.85rem 1.5rem; border-top: 1px solid var(--im-blue-green-light); background: var(--im-white);
  }
  .btn {
    font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.72rem 1.35rem; border-radius: 2px; border: none; transition: all 0.15s ease;
  }
  .btn-primary { background: var(--im-blue-green); color: white; }
  .btn-primary:disabled { background: var(--im-blue-green-30); cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--im-blue-green); border: 1px solid var(--im-blue-green); }
  .btn-ghost { background: transparent; color: var(--im-grey); border: 1px dashed var(--im-blue-green-30); }
  .btn-ghost:active { color: var(--im-blue-green); border-color: var(--im-blue-green); }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.97); }

  .attract {
    position: fixed; inset: 0; background: var(--im-black);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; transition: opacity 0.4s ease;
  }
  .attract.hidden { opacity: 0; pointer-events: none; }
  .attract .a-logo { color: white; font-size: 1.05rem; letter-spacing: 0.05em; margin-bottom: 2rem; opacity: 0.85; text-align: center; padding: 0 1rem; }
  .attract .a-logo span { color: var(--im-green-grey); }
  .attract h1 { font-family: var(--font-display); font-weight: normal; color: white; font-size: 2.5rem; margin: 0 0 0.5rem; text-align: center; padding: 0 1.5rem; }
  .attract h1 em { color: var(--im-green-grey); font-style: italic; }
  .attract .a-vibe {
    margin-top: 0.9rem; font-size: 0.72rem; color: var(--im-grey);
    letter-spacing: 0.06em; font-style: italic;
  }
  .attract .tap { margin-top: 2.5rem; font-size: 0.8rem; color: var(--im-green-grey); text-transform: uppercase; letter-spacing: 0.1em; animation: pulse 1.8s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }


  /* =====================================================================

function motorLabel(n) {

function tierName(n) {

/* ================= COLOUR UTILS ================= */
function hex2rgb(h) { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hex(r,g,b) { return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
function darken(h, f) { return mix(h, '#000000', f); }
function lighten(h, f) { return mix(h, '#ffffff', f); }
function lum(h) { const [r,g,b] = hex2rgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; }

/* 10 paint slots in selection order */
function paint() {
  const cols = [...state.practices].map(id => PCOLOR[id]);
  return {
    n: cols.length,
    hasPaint: cols.length > 0,
    body:    cols[0] || null,
    roof:    cols[1] || null,
    stripe:  cols[2] || null,
    rocker:  cols[3] || null,
    accent:  cols[4] || null,
    nose:    cols[5] || null,
    tail:    cols[6] || null,
    pin:     cols[7] || null,
    sillpin: cols[8] || null,
    kit:     cols[9] || null,
  };
}

/* ================= STEPPER ================= */
function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s, i) => {
    let cls = 'step';
    if (i === state.stepIndex) cls += ' active';
    else if (i < state.stepIndex) cls += ' done';
    const done = i < state.stepIndex;
    return `<div class="${cls}" data-step="${i}">${done ? '<span class="tick">✓</span>' : ''}${STEP_LABELS[s]}</div>`;
  }).join('');
  [...el.children].forEach(child => {
    child.addEventListener('click', () => {
      const idx = parseInt(child.dataset.step);
      let ok = true;
      for (let k = 0; k < idx; k++) if (!canProceedFrom(k)) ok = false;
      if (idx <= state.stepIndex || ok) { state.stepIndex = idx; renderAll(); }
    });
  });
}

/* ================= PLAYFUL SPEC FIGURES ================= */
function accelTime() {
  const hp = totalHp(), w = kerbWeight();
  if (!hp) return '—';
  return Math.max(2.1, (w / hp) * 1.9).toFixed(1);
}
function kerbWeight() {
  return 1200 + totalPeople() * 95 + state.practices.size * 18 + state.packages.size * 25;
}
function rangeKm() {
  const base = 420 + state.practices.size * 12 - state.packages.size * 10;
  return Math.round(Math.max(260, base + totalPeople() * 8) / 5) * 5;
}

/* What each package adds — kit on the car, capability on the project */
const PKG_GIVES = {
  workshop:'the roof box carries co-creation workshops, so the outcome is designed together with your team',
  keynote: 'the splitter and diffuser are expert interviews — outside perspective that keeps the build stable at speed',
  deepdive:'the side skirts are Tech Collective AI deployment — technology built low into the platform',
  sprint:  'the rear spoiler is a senior advisory sprint — extra downforce when decisions come fast',
};

/* What the crew size means for the project */
function tierGives(n) {
  if (n === 1) return 'one senior pair of hands — light, fast and focused';
  if (n <= 3) return 'focused power for one clear problem';
  if (n <= 6) return 'bandwidth to run workstreams in parallel';
  return 'firm-wide muscle for enterprise-wide change';
}

function buildNarrative() {
  const proj = currentProject();
  const people = totalPeople();
  const hp = totalHp();
  const n = state.practices.size;
  const parts = [];

  parts.push(proj ? PROJ_LINE[proj.id] : 'No project selected yet.');

  if (people) {
    const seniorHp = (state.engine.sp||0)*150 + (state.engine.p||0)*120;
    const juniorHp = (state.engine.c||0)*50 + (state.engine.jc||0)*30;
    const sShare = seniorHp / hp, jShare = juniorHp / hp;
    let mixTxt;
    if (sShare >= 0.5) mixTxt = 'senior-heavy, so most of the torque comes from experience';
    else if (jShare >= 0.5) mixTxt = 'young and high-revving, with energy to spare';
    else mixTxt = 'a balanced mix of experience and drive';
    parts.push(`The engine is a crew of ${people} (${tierName(people)}) delivering ${hp} hp: ${tierGives(people)}. The mix is ${mixTxt}.`);
  }

  if (n) {
    const bits = [...state.practices].map(id => `${id} adds ${PRACTICE_GIVES[id] || 'specialist capability'}`);
    const last = bits.pop();
    parts.push('Every colour on the body does a job: ' + (bits.length ? bits.join(', ') + ' and ' + last : last) + '.');
  }

  if (state.packages.size) {
    const bits = [...state.packages].map(id => PKG_GIVES[id]);
    const first = bits.shift();
    parts.push('On the kit side, ' + first + (bits.length ? '; ' + bits.join('; ') : '') + '.');
  }

  return parts.join(' ');
}

/* ================= NAMES ================= */
function getBuildName(plain) {
  const proj = currentProject();
  if (!proj) return 'Your Implement';
  const hp = totalHp();
  const core = proj.model + (hp ? ' ' + hp : '');
  const pkgTag = state.packages.size ? [...state.packages].map(id => PACKAGES.find(p=>p.id===id).tag).join('/') : '';
  if (plain) return 'The ' + core + (pkgTag ? ' — ' + pkgTag : '');
  return `The <em>${core}</em>${pkgTag ? ' — ' + pkgTag : ''}`;
}

function buildSummaryText() {
  const people = totalPeople();
  const proj = currentProject();
  return [
    'IMPLEMENT BUILD',
    getBuildName(true),
    'Project: ' + (proj ? proj.name + ' (' + proj.model + ')' : '-'),
    'Paint job: ' + (state.practices.size ? [...state.practices].join(', ') : '-'),
    'Powertrain: ' + (people ? motorLabel(people) + ' Electric, ' + totalHp() + 'hp / ' + kW() + 'kW (' + engineCompositionText() + ')' : '-'),
    'Packages: ' + (state.packages.size ? [...state.packages].map(id=>PACKAGES.find(p=>p.id===id).name).join(', ') : '-'),

}

    <div class="p-row"><div class="l">0–100 / range</div><div class="v">${people ? accelTime() + ' s · ' + rangeKm() + ' km · ' + kerbWeight() + ' kg' : '—'}</div></div>

}

/* ================= CAR RENDER (lineup drawing system) ================= */
function cr(pts,t=0.75){let d='';for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];
 d+=` C ${(p1[0]+(p2[0]-p0[0])*t/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])*t/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])*t/6).toFixed(1)} ${p2[0]} ${p2[1]}`;}return d;}

function drawCar(S, o){
  o=Object.assign({body:null,roof:null,stripe:null,rocker:null,accent:null,nose:null,tail:null,pin:null,sillpin:null,kit:null,packages:new Set(),lightsOn:false,clipId:'c'},o);
  const ox=(VB_W-S.length*PX)/2;
  const X=m=>+(ox+m*PX).toFixed(1), Y=m=>+(GROUND-m*PX).toFixed(1);
  const A=S.anchors, L=S.lower, [fw,rw]=S.wheels;
  const topY=xm=>{const t=S.top;for(let i=0;i<t.length-1;i++){if(xm>=t[i][0]&&xm<=t[i+1][0]){const f=(xm-t[i][0])/(t[i+1][0]-t[i][0]);return t[i][1]+(t[i+1][1]-t[i][1])*f;}}return t[t.length-1][1];};
  const x0=X(0),x1=X(S.length),fwx=X(fw.cx),rwx=X(rw.cx),hubF=Y(fw.cy),hubR=Y(rw.cy);
  const lipF=Y(L.front),sill=Y(L.sill),rS=[X(L.rearStart[0]),Y(L.rearStart[1])],rE=[x1,Y(L.rearEnd[1])];
  const rearY=x=>rS[1]+(rE[1]-rS[1])*(x-rS[0])/(rE[0]-rS[0]);
  const arcEnds=(w,hub,yl,yr)=>{const R=w.arch*PX,cx=X(w.cx);return{cx,R,xl:cx-Math.sqrt(Math.max(0,R*R-(yl-hub)**2)),xr:cx+Math.sqrt(Math.max(0,R*R-(yr-hub)**2))};};
  const fa=arcEnds(fw,hubF,lipF,sill), ra=arcEnds(rw,hubR,sill,rearY(X(rw.cx)+rw.arch*PX));
  const top=S.top.map(p=>[X(p[0]),Y(p[1])]);
  let bp=`M ${x0} ${lipF} L ${top[0][0]} ${top[0][1]}`+cr(top)+` L ${rE[0]} ${rE[1]} L ${ra.xr.toFixed(1)} ${rearY(ra.xr).toFixed(1)} A ${ra.R.toFixed(1)} ${ra.R.toFixed(1)} 0 0 0 ${ra.xl.toFixed(1)} ${sill} L ${fa.xr.toFixed(1)} ${sill} A ${fa.R.toFixed(1)} ${fa.R.toFixed(1)} 0 0 0 ${fa.xl.toFixed(1)} ${lipF} L ${x0} ${lipF} Z`;

  const hasPaint=!!o.body,bodyFill=hasPaint?o.body:'#F1F4F3',dark=lum(bodyFill)<.35,detail=dark?'#F8F5E7':'#1F1F23';
  const accent=o.accent||(hasPaint?darken(o.body,.3):'#A8A5A1'),rimCol=o.accent||'#C9C7C4',kitFill=o.kit||'#1F1F23',kitEdge=lum(kitFill)>.6?'#1F1F23':(dark?'#F8F5E7':'none'),kitLine=lum(kitFill)>.6?'#1F1F23':'#F8F5E7';
  const beltF=Y(A.beltF),beltR=Y(A.beltR),cowlX=X(A.cowl),deckX=X(A.deck),aTopX=X(A.aTop),cBaseX=X(A.cBase);
  const gx0=A.cowl+.14, gx1=A.cBase-.05;
  const beltAt=x=>beltF+(beltR-beltF)*Math.max(0,Math.min(1,(x-X(gx0))/(X(gx1)-X(gx0))));

  let s=`<svg viewBox="0 0 ${VB_W} ${VB_H}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${o.clipId}"><path d="${bp}"/></clipPath></defs>`;
  s+=`<line x1="30" y1="${GROUND}" x2="${VB_W-30}" y2="${GROUND}" stroke="#E1E6E5" stroke-width="1.5"/><ellipse cx="${(x0+x1)/2}" cy="${GROUND+3}" rx="${(x1-x0)/2+8}" ry="7" fill="#F2F2F1"/>`;
  // wheel wells (inside the arch only)
  [[fa,hubF,lipF],[ra,hubR,sill]].forEach(([a,hub,edge])=>{const hw=Math.sqrt(Math.max(0,a.R*a.R-(edge-hub)**2));s+=`<path d="M ${(a.cx-hw).toFixed(1)} ${edge} A ${a.R} ${a.R} 0 0 1 ${(a.cx+hw).toFixed(1)} ${edge} Z" fill="#17181B"/>`;});
  // side skirts
  if(o.packages.has('deepdive')){const sx0=fa.xr+2,sx1=ra.xl-2;s+=`<path d="M ${sx0-8} ${sill-3} L ${sx1+8} ${sill-3} L ${sx1+2} ${sill+13} L ${sx0-2} ${sill+13} Z" fill="${kitFill}" stroke="${kitEdge}" stroke-width="1.2"/><line x1="${sx0+14}" y1="${sill+5}" x2="${sx1-14}" y2="${sill+5}" stroke="${kitLine}" stroke-width="1.2" opacity=".45"/>`;}
  // body + livery
  s+=`<path d="${bp}" fill="${bodyFill}"/><g clip-path="url(#${o.clipId})">`;
  if(o.nose)s+=`<rect x="${x0-10}" y="0" width="${(cowlX-x0)*.55+10}" height="${VB_H}" fill="${o.nose}"/>`;
  if(o.tail){const tx=deckX+(x1-deckX)*.35;s+=`<rect x="${tx}" y="0" width="${x1-tx+20}" height="${VB_H}" fill="${o.tail}"/>`;}
  if(o.rocker)s+=`<rect x="${x0}" y="${sill-16}" width="${x1-x0}" height="16" fill="${o.rocker}"/>`;
  if(o.roof){ if(S.openTop) s+=`<rect x="${X(A.cBase)}" y="0" width="${x1-X(A.cBase)+20}" height="${Y(topY(A.deck))+8}" fill="${o.roof}"/>`;
              else s+=`<rect x="${aTopX-70}" y="0" width="${cBaseX-aTopX+140}" height="${Y(Math.min(topY(A.aTop+0.1),topY(A.cBase-0.1))-0.08)}" fill="${o.roof}"/>`; }
  if(o.stripe)s+=`<path d="M ${x0-10} ${beltF+30} Q ${cowlX} ${beltF+12} ${(cowlX+deckX)/2} ${(beltF+beltR)/2+24} T ${x1+10} ${beltR+30}" fill="none" stroke="${o.stripe}" stroke-width="13"/>`;
  if(o.pin)s+=`<path d="M ${x0-10} ${beltF+45} Q ${cowlX} ${beltF+27} ${(cowlX+deckX)/2} ${(beltF+beltR)/2+39} T ${x1+10} ${beltR+45}" fill="none" stroke="${o.pin}" stroke-width="4"/>`;
  if(o.sillpin)s+=`<rect x="${x0}" y="${sill-21}" width="${x1-x0}" height="3.5" fill="${o.sillpin}"/>`;
  s+=`<rect x="${x0+6}" y="${lipF-26}" width="${Math.min(54,fa.xl-x0-14)}" height="9" rx="4" fill="#1F1F23" opacity=".82"/></g>`;
  s+=`<path d="${bp}" fill="none" stroke="#1F1F23" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  // glasshouse
  const off=.055;
  if(S.openTop){
    s+=`<line x1="${X(A.cowl+.12)}" y1="${Y(topY(A.cowl+.12))+2}" x2="${X(A.aTop)}" y2="${Y(topY(A.aTop))+4}" stroke="#2A3136" stroke-width="5" stroke-linecap="round"/>`;
  } else {
    const gl=[];for(let xm=gx0;xm<=gx1;xm+=.1)gl.push([X(xm),Y(topY(xm)-off)]);gl.push([X(gx1),Y(topY(gx1)-off)]);
    s+=`<path d="M ${X(gx0)} ${beltF+2} L ${gl[0][0]} ${gl[0][1]}${cr(gl)} L ${X(gx1)} ${beltR+1} Z" fill="#2A3136" stroke="#1F1F23" stroke-width="1.6"/>`;
    s+=`<line x1="${X(A.aTop+.25)}" y1="${Y(topY(A.aTop+.25)-off)+6}" x2="${X(A.cowl+.38)}" y2="${beltF-4}" stroke="#fff" stroke-width="2.5" opacity=".22"/>`;
    [S.bPillar,S.extraPillar].filter(Boolean).forEach(px=>{const bx=X(px);s+=`<line x1="${bx}" y1="${Y(topY(px)-off)+2}" x2="${bx+2}" y2="${beltAt(bx)+1}" stroke="${bodyFill}" stroke-width="7"/><line x1="${bx}" y1="${Y(topY(px)-off)+2}" x2="${bx+2}" y2="${beltAt(bx)+1}" stroke="#1F1F23" stroke-width="1" opacity=".4"/>`;});
  }
  // seams + handles + mirror
  S.seams.forEach(m=>{const x=X(m);s+=`<path d="M ${x} ${beltAt(x)+4} Q ${x+3} ${(beltAt(x)+sill)/2} ${x+1} ${sill-8}" fill="none" stroke="${detail}" stroke-width="1.3" opacity=".7"/>`;});
  S.handles.forEach(m=>{const x=X(m);s+=`<line x1="${x-24}" y1="${beltAt(x)+15}" x2="${x}" y2="${beltAt(x)+15}" stroke="${detail}" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>`;});
  s+=`<line x1="${cowlX+21}" y1="${Y(A.beltF+.02)}" x2="${cowlX+12}" y2="${Y(A.beltF+.1)}" stroke="${detail}" stroke-width="2"/><rect x="${cowlX+3}" y="${Y(A.beltF+.16)}" width="15" height="9" rx="3" fill="${accent}" stroke="#1F1F23" stroke-width="1.2"/>`;
  // lights
  const hl=o.lightsOn?'#E4B73C':accent, nY=S.top[0][1];
  if(S.drl==='square') s+=`<rect x="${x0+6}" y="${Y(topY(0.08)-0.08)}" width="19" height="16" rx="3" fill="${hl}" stroke="#1F1F23" stroke-width="1.4"/><rect x="${x0+10}" y="${Y(topY(0.08)-0.11)}" width="11" height="8" rx="1.5" fill="none" stroke="#1F1F23" stroke-width="1"/>`;
  else if(S.drl==='flat') { const yy=Y(topY(0.06)-0.09); s+=`<rect x="${x0+5}" y="${yy}" width="${X(0.48)-x0-5}" height="7" rx="2" fill="${hl}" stroke="#1F1F23" stroke-width="1.2"/>`; }
  else { const dx=0.46; s+=`<path d="M ${x0+4} ${Y(topY(0.03)-0.07)} L ${X(dx)} ${Y(topY(dx)-0.06)} L ${X(dx)} ${Y(topY(dx)-0.10)} L ${x0+5} ${Y(topY(0.03)-0.13)} Z" fill="${hl}" stroke="#1F1F23" stroke-width="1.2"/>`; }
  let minTop=9; for(let xm=S.length-0.42; xm<=S.length-0.14; xm+=0.02) minTop=Math.min(minTop, topY(xm));
  const tlY=Math.max(L.rearEnd[1]+0.14, Math.min(minTop-0.08, A.beltR+0.06));
  s+=`<line x1="${x1-58}" y1="${Y(tlY+.01)}" x2="${x1-20}" y2="${Y(tlY)}" stroke="${o.lightsOn?'#451F23':'#7D7A76'}" stroke-width="5" stroke-linecap="round"/>`;
  if(o.lightsOn)s+=`<g stroke="#E4B73C" stroke-width="2" stroke-linecap="round" opacity=".8"><line x1="${x0-8}" y1="${Y(topY(0.03)-0.08)}" x2="${x0-48}" y2="${Y(topY(0.03)-0.03)}"/><line x1="${x0-8}" y1="${Y(topY(0.03)-0.12)}" x2="${x0-48}" y2="${Y(topY(0.03)-0.17)}"/></g>`;
  s+=`<rect x="${ra.xr-2}" y="${beltR+16}" width="12" height="9" rx="2" fill="none" stroke="${detail}" stroke-width="1.5"/>`;
  // kit
  if(o.packages.has('keynote')){const fxEnd=fa.xl+6;s+=`<path d="M ${x0-22} ${lipF+13} L ${fxEnd} ${lipF+13} L ${fxEnd} ${lipF-2} L ${x0-8} ${lipF-2} Z" fill="${kitFill}" stroke="${kitEdge}" stroke-width="1.2"/><line x1="${x0-16}" y1="${lipF+6}" x2="${fxEnd-6}" y2="${lipF+6}" stroke="${kitLine}" stroke-width="1.2" opacity=".45"/>`;
    const dx0=ra.xr-4,dx1=x1+14;s+=`<path d="M ${dx0} ${rearY(dx0)-2} L ${x1} ${rE[1]-2} L ${dx1} ${rE[1]+13} L ${dx0} ${rearY(dx0)+13} Z" fill="${kitFill}" stroke="${kitEdge}" stroke-width="1.2"/>`;
    for(let i=1;i<=4;i++){const fx=dx0+i*(x1-dx0)/5,yy=rearY(fx);s+=`<line x1="${fx}" y1="${yy-2}" x2="${fx+3}" y2="${yy+13}" stroke="${kitLine}" stroke-width="2"/>`;}}
  if(o.packages.has('sprint')){const d0=deckX-8,d1=Math.min(x1+2,deckX+124),dy=Y(topY(A.deck));s+=`<g stroke="${kitFill}" stroke-width="5" stroke-linecap="round" fill="none"><line x1="${d0+12}" y1="${dy-2}" x2="${d0+16}" y2="${dy-24}"/><line x1="${d1-16}" y1="${Y(topY(Math.min(S.length-0.05,A.deck+.3)))-2}" x2="${d1-10}" y2="${dy-15}"/><line x1="${d0+2}" y1="${dy-26}" x2="${d1+6}" y2="${dy-13}"/></g><line x1="${d1+6}" y1="${dy-22}" x2="${d1+8}" y2="${dy-4}" stroke="${kitFill}" stroke-width="3.5" stroke-linecap="round"/>`;}
  if(S.rails){const r0=X(A.aTop+.25),r1=X(A.cBase-.25);s+=`<line x1="${r0}" y1="${Y(S.height)-5}" x2="${r1}" y2="${Y(S.height)-5}" stroke="#1F1F23" stroke-width="3" stroke-linecap="round"/><line x1="${r0+10}" y1="${Y(S.height)-4}" x2="${r0+10}" y2="${Y(S.height)+1}" stroke="#1F1F23" stroke-width="2.5"/><line x1="${r1-10}" y1="${Y(S.height)-4}" x2="${r1-10}" y2="${Y(S.height)+1}" stroke="#1F1F23" stroke-width="2.5"/>`;}
  if(o.packages.has('workshop')){
    // box sits on the local surface and leans with it
    let b0,b1;
    if(S.openTop){ b0=A.boxStart??A.cBase+.1; b1=A.boxEnd??A.deck-.3; } else { b0=A.aTop+.15; b1=A.cBase-.45; }
    const bwM=Math.max(0.55, Math.min(1.05, b1-b0)); const bmid=(b0+b1)/2; b0=bmid-bwM/2; b1=bmid+bwM/2;
    const ySurf=xm=>S.openTop?topY(xm):Math.min(topY(xm),S.height);
    const yA=Y(ySurf(b0+0.12)), yB=Y(ySurf(b1-0.12)), xA=X(b0+0.12), xB=X(b1-0.12);
    const ang=Math.atan2(yB-yA,xB-xA)*180/Math.PI;
    const cx=(xA+xB)/2, cy=(yA+yB)/2 - (S.rails?6:0);
    const bw=xB-xA+36;
    s+=`<g transform="rotate(${ang.toFixed(2)} ${cx.toFixed(1)} ${cy.toFixed(1)})">
      <line x1="${cx-bw/2+18}" y1="${cy-10}" x2="${cx-bw/2+18}" y2="${cy+2}" stroke="#1F1F23" stroke-width="2.5"/>
      <line x1="${cx+bw/2-18}" y1="${cy-10}" x2="${cx+bw/2-18}" y2="${cy+2}" stroke="#1F1F23" stroke-width="2.5"/>
      <rect x="${cx-bw/2}" y="${cy-34}" width="${bw}" height="24" rx="11" fill="${kitFill}" stroke="${kitEdge==='none'?'#1F1F23':kitEdge}" stroke-width="1.6"/>
      <line x1="${cx-bw/2+10}" y1="${cy-24}" x2="${cx+bw/2-10}" y2="${cy-24}" stroke="${kitLine}" stroke-width="1.3" opacity=".55"/>
      <line x1="${cx+bw/2-34}" y1="${cy-31}" x2="${cx+bw/2-22}" y2="${cy-31}" stroke="#67817F" stroke-width="3" stroke-linecap="round"/>
    </g>`;
  }
  // wheels
  const wheel=(cx,cy,r)=>{let w=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#26262B" stroke="#141416" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${r-4}" fill="none" stroke="#3A3A40" stroke-width="1"/>`;
    const rr=r*.72;w+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${rimCol}" stroke="#1F1F23" stroke-width="1.6"/>`;
    const sp=darken(rimCol,.45);for(let a=0;a<5;a++){const g=(-90+a*72)*Math.PI/180;w+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(g)*rr*.88}" y2="${cy+Math.sin(g)*rr*.88}" stroke="${sp}" stroke-width="4.5" stroke-linecap="round"/>`;}
    return w+`<circle cx="${cx}" cy="${cy}" r="${r*.13}" fill="#1F1F23"/>`;};
  s+=wheel(fwx,hubF,fw.r*PX)+wheel(rwx,hubR,rw.r*PX);
  return s+`</svg>`;
}

function renderCarSVG() {
  const proj = currentProject();
  const onSummary = STEPS[state.stepIndex] === 'summary';
  if (!proj) {
    // ghost silhouette until an ambition is chosen
    const S = CARS.leadership, ox=(VB_W-S.length*PX)/2, X=m=>+(ox+m*PX).toFixed(1), Y=m=>+(GROUND-m*PX).toFixed(1);
    const top=S.top.map(p=>[X(p[0]),Y(p[1])]); const [fw,rw]=S.wheels; const sill=Y(S.lower.sill);
    const d=`M ${X(0)} ${Y(S.lower.front)} L ${top[0][0]} ${top[0][1]}`+cr(top)+` L ${X(S.length)} ${Y(S.lower.rearEnd[1])} L ${X(S.length)} ${sill} L ${X(0)} ${sill} Z`;
    return `<svg class="stage-svg fadein" viewBox="0 0 ${VB_W} ${VB_H}" preserveAspectRatio="xMidYMid meet">
      <line x1="30" y1="${GROUND}" x2="870" y2="${GROUND}" stroke="#E1E6E5" stroke-width="1.5"/>
      <path d="${d}" fill="none" stroke="#C2CDCC" stroke-width="2.5" stroke-dasharray="8 8" stroke-linejoin="round"/>
      <circle cx="${X(fw.cx)}" cy="${Y(fw.cy)}" r="${fw.r*PX}" fill="none" stroke="#C2CDCC" stroke-width="2" stroke-dasharray="8 8"/>
      <circle cx="${X(rw.cx)}" cy="${Y(rw.cy)}" r="${rw.r*PX}" fill="none" stroke="#C2CDCC" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="450" y="440" text-anchor="middle" font-family="Arial" font-size="13" fill="#A8A5A1">Choose an ambition to shape your car</text>
    </svg>`;
  }
  const pt = paint();
  const svg = drawCar(CARS[proj.id], {
    body: pt.body, roof: pt.roof, stripe: pt.stripe, rocker: pt.rocker, accent: pt.accent,
    nose: pt.nose, tail: pt.tail, pin: pt.pin, sillpin: pt.sillpin, kit: pt.kit,
    packages: state.packages, lightsOn: onSummary, clipId: 'bodyClip'
  });
  return svg.replace('<svg ', '<svg class="stage-svg fadein" preserveAspectRatio="xMidYMid meet" ');
}

/* ================= MOTOR RENDER ================= */
function renderMotorSVG() {
  const people = totalPeople();
  const hp = totalHp();
  const t = Math.min(hp / 1000, 1);
  const motorCol = mix('#C2CDCC', '#1F1F23', t);
  const rotorCol = darken(motorCol, 0.3);
  const cx = 400, cy = 220, R = 100;

  let s = `<svg class="stage-svg fadein" viewBox="0 0 900 470" preserveAspectRatio="xMidYMid meet">`;

  if (people === 0) {
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#C2CDCC" stroke-width="2.5" stroke-dasharray="8 8"/>
      <circle cx="${cx}" cy="${cy}" r="44" fill="none" stroke="#C2CDCC" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="${cx}" y="${cy+150}" text-anchor="middle" font-family="Arial" font-size="13" fill="#A8A5A1">Add crew to assemble your motor</text>
      </svg>`;
    return s;
  }

  s += `<circle cx="${cx}" cy="${cy}" r="${R+14}" fill="none" stroke="#67817F" stroke-width="${3 + t*9}" opacity="${0.18 + t*0.62}"/>`;

  const fins = Math.min(people, 12);
  for (let i = 0; i < fins; i++) {
    const ang = (-90 + i * (360 / fins)) * Math.PI / 180;
    const x1 = cx + Math.cos(ang) * (R + 2), y1 = cy + Math.sin(ang) * (R + 2);
    const x2 = cx + Math.cos(ang) * (R + 20), y2 = cy + Math.sin(ang) * (R + 20);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#30373B" stroke-width="5" stroke-linecap="round"/>`;
  }

  s += `<path d="M ${cx-70} ${cy+R-8} L ${cx-96} ${cy+R+34} L ${cx-46} ${cy+R+34} Z" fill="#A8A5A1" stroke="#1F1F23" stroke-width="2"/>`;
  s += `<path d="M ${cx+70} ${cy+R-8} L ${cx+46} ${cy+R+34} L ${cx+96} ${cy+R+34} Z" fill="#A8A5A1" stroke="#1F1F23" stroke-width="2"/>`;
  s += `<line x1="${cx-120}" y1="${cy+R+34}" x2="${cx+120}" y2="${cy+R+34}" stroke="#1F1F23" stroke-width="3"/>`;

  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${motorCol}" stroke="#1F1F23" stroke-width="3"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="66" fill="none" stroke="${lighten(motorCol,0.25)}" stroke-width="2" stroke-dasharray="4 7"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="44" fill="${rotorCol}" stroke="#1F1F23" stroke-width="2.5"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="10" fill="#F8F5E7" stroke="#1F1F23" stroke-width="2"/>`;

  s += `<path d="M ${cx+8} ${cy-30} L ${cx-14} ${cy+4} L ${cx+2} ${cy+4} L ${cx-8} ${cy+30} L ${cx+16} ${cy-4} L ${cx} ${cy-4} Z" fill="none" stroke="#E4B73C" stroke-width="2.5" stroke-linejoin="round"/>`;

  s += `<rect x="${cx+R}" y="${cy-11}" width="58" height="22" rx="3" fill="#A8A5A1" stroke="#1F1F23" stroke-width="2"/>`;
  s += `<circle cx="${cx+R+72}" cy="${cy}" r="17" fill="none" stroke="#1F1F23" stroke-width="2.5"/>`;
  s += `<circle cx="${cx+R+72}" cy="${cy}" r="6" fill="none" stroke="#1F1F23" stroke-width="1.5"/>`;

  s += `<path d="M ${cx+30} ${cy-R+6} Q ${cx+120} ${cy-R-58} ${cx+188} ${cy-R-30}" fill="none" stroke="#67817F" stroke-width="4.5" stroke-linecap="round"/>`;
  s += `<rect x="${cx+186}" y="${cy-R-52}" width="118" height="48" rx="3" fill="#F1F4F3" stroke="#1F1F23" stroke-width="2"/>`;
  s += `<text x="${cx+245}" y="${cy-R-30}" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#30373B">INVERTER</text>`;
  s += `<text x="${cx+245}" y="${cy-R-15}" text-anchor="middle" font-family="Arial" font-size="8" letter-spacing="1" fill="#A8A5A1">HIGH VOLTAGE</text>`;

  s += `<text x="${cx}" y="${cy+R+92}" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="44" fill="#67817F">${hp}<tspan font-family="Arial" font-size="13" fill="#30373B" letter-spacing="2" dx="6">HP</tspan></text>`;
  s += `<text x="${cx}" y="${cy+R+114}" text-anchor="middle" font-family="Arial" font-size="12" letter-spacing="2" fill="#A8A5A1">${kW()} KW · ${motorLabel(people).toUpperCase()} · ${fins} COOLING FIN${fins===1?'':'S'}</text>`;

  s += `</svg>`;
  return s;
}

/* ================= STAGE ================= */
function updateStage() {
  const stage = document.getElementById('stage');
  const step = STEPS[state.stepIndex];
  stage.innerHTML = step === 'powertrain' ? renderMotorSVG() : renderCarSVG();

  const proj = currentProject();
  const plate = document.getElementById('stagePlate');
  plate.innerHTML = proj
    ? `<b>${getBuildName(true)}</b>${step === 'powertrain' ? ' &nbsp;·&nbsp; powertrain view' : ''}`
    : 'Implement Manufaktur';
}

/* ================= SPEC STRIP ================= */
function renderSpecStrip() {
  const el = document.getElementById('specStrip');
  const proj = currentProject();
  const people = totalPeople();
  const cells = [
    { k:'Model',      v: proj ? getBuildName(true).replace(/^The /,'') : null },
    { k:'Body',       v: proj ? proj.model : null },
    { k:'Paint job',  v: state.practices.size ? [...state.practices].join(' × ') : null },
    { k:'Powertrain', v: people ? motorLabel(people) + ' Electric' : null },
    { k:'Output',     v: people ? totalHp() + ' hp · ' + kW() + ' kW' : null },
    { k:'Crew',       v: people ? people + ' · ' + tierName(people) : null },
    { k:'Options',    v: state.packages.size ? [...state.packages].map(id=>PACKAGES.find(p=>p.id===id).tag).join(' · ') : null },
  ];
  el.innerHTML = cells.map(c => `
    <div class="spec-cell">
      <div class="k">${c.k}</div>
      <div class="v ${c.v ? '' : 'dim'}">${c.v || '—'}</div>
    </div>
  `).join('');
}

/* ================= NAV ================= */
function canProceedFrom(stepIdx) {
  const step = STEPS[stepIdx];
  if (step === 'project') return !!state.project;
  if (step === 'paint') return state.practices.size > 0;
  if (step === 'powertrain') return totalPeople() > 0;
  return true;
}

function renderFooter() {
  const back = document.getElementById('backBtn');
  const next = document.getElementById('nextBtn');
  back.disabled = state.stepIndex === 0;
  const isLast = state.stepIndex === STEPS.length - 1;
  next.textContent = isLast ? 'Start Over' : (STEPS[state.stepIndex] === 'packages' ? 'See My Build' : 'Next');
  next.disabled = !isLast && !canProceedFrom(state.stepIndex);

  const surprise = document.getElementById('surpriseBtn');
  surprise.style.display = isLast ? 'none' : '';
  surprise.onclick = randomBuild;

  back.onclick = () => { if (state.stepIndex > 0) { state.stepIndex--; renderAll(); } };
  next.onclick = () => {
    if (isLast) { state = freshState(); openInfo.clear(); }
    else state.stepIndex++;
    renderAll();
  };
}

/* ================= SURPRISE ME ================= */
function pick(arr, n) {
  const copy = arr.slice();
  const out = [];
  while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random()*copy.length), 1)[0]);
  return out;
}
function randomBuild() {
  state = freshState();
  openInfo.clear();

  state.project = PROJECTS[Math.floor(Math.random()*PROJECTS.length)].id;
  pick(PRACTICES.map(p => p.id), 2 + Math.floor(Math.random()*4)).forEach(id => state.practices.add(id));

  const crewSize = 2 + Math.floor(Math.random()*5);
  const roleIds = pick(ROLES.map(r => r.id), 2 + Math.floor(Math.random()*2));
  let left = crewSize;
  roleIds.forEach((id, i) => {
    const take = (i === roleIds.length - 1) ? left : 1 + Math.floor(Math.random()*Math.max(1, left - (roleIds.length - 1 - i)));
    if (take > 0) { state.engine[id] = take; left -= take; }
  });
  if (totalPeople() === 0) state.engine[ROLES[3].id] = 2;

  pick(PACKAGES.map(p => p.id), 1 + Math.floor(Math.random()*2)).forEach(id => state.packages.add(id));

  state.stepIndex = STEPS.indexOf('summary');
  renderAll();
}

/* ================= MASTER ================= */
function renderAll() {
  renderStepper();
  renderConfigBody();
  updateStage();
  renderSpecStrip();
  renderFooter();
  resetIdle();
}

/* ================= IDLE / ATTRACT ================= */
function showAttract() { document.getElementById('attract').classList.remove('hidden'); }
function hideAttract() { document.getElementById('attract').classList.add('hidden'); }
function resetIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showAttract, IDLE_MS);
}
document.getElementById('attract').addEventListener('click', () => {
  hideAttract();
  state = freshState();
  openInfo.clear();
  renderAll();
});
['click','touchstart','pointerdown'].forEach(evt => {
  document.getElementById('app').addEventListener(evt, resetIdle, { passive: true });
});

/* ================= STAFF PANEL: triple-tap logo ================= */
let logoTaps = [];
document.getElementById('logoTap').addEventListener('click', () => {
  const now = Date.now();
  logoTaps = logoTaps.filter(t => now - t < 1200);
  logoTaps.push(now);
  if (logoTaps.length >= 3) {
    logoTaps = [];
    document.getElementById('staffPanel').classList.add('open');
  }
});
document.getElementById('staffReset').addEventListener('click', () => {
  document.getElementById('staffPanel').classList.remove('open');
  state = freshState();
  openInfo.clear();
  renderAll();
  showAttract();
});
document.getElementById('staffClose').addEventListener('click', () => {
  document.getElementById('staffPanel').classList.remove('open');
});

/* ================= INIT (opens on "Press to start") ================= */
renderAll();
</script>
